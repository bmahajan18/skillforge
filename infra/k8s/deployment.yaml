apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge-api
  labels:
    app: skillforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillforge-api
  template:
    metadata:
      labels:
        app: skillforge-api
    spec:
      containers:
      - name: api
        image: skillforge-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          value: "postgres://skillforge:skillforge_secret_pass@postgres-service:5432/skillforge_db?sslmode=disable"
        - name: REDIS_URL
          value: "redis-service:6379"
        - name: RABBITMQ_URL
          value: "amqp://skillforge:skillforge_secret_pass@rabbitmq-service:5672/"
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: skillforge-api-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: skillforge-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge-worker
  labels:
    app: skillforge-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillforge-worker
  template:
    metadata:
      labels:
        app: skillforge-worker
    spec:
      containers:
      - name: worker
        image: skillforge-worker:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          value: "postgres://skillforge:skillforge_secret_pass@postgres-service:5432/skillforge_db?sslmode=disable"
        - name: REDIS_URL
          value: "redis-service:6379"
        - name: RABBITMQ_URL
          value: "amqp://skillforge:skillforge_secret_pass@rabbitmq-service:5672/"
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skillforge-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skillforge-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
